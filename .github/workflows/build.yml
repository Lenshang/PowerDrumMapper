name: Build Plugins

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============================================================
  # Windows 构建
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target PowerDrumMapper_VST3 PowerDrumMapper_Standalone PowerDrumMapper_CLAP

      - name: Build tests
        run: cmake --build build --config Release --parallel --target PowerDrumMapperTests

      - name: Run tests
        run: .\build\PowerDrumMapperTests_artefacts\Release\PowerDrumMapperTests.exe

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-Windows-CLAP
          path: |
            build/PowerDrumMapper_artefacts/Release/CLAP/

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-Windows-VST3
          path: |
            build/PowerDrumMapper_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-Windows-Standalone
          path: |
            build/PowerDrumMapper_artefacts/Release/Standalone/

  # ============================================================
  # macOS 构建 (Universal Binary: Intel + Apple Silicon)
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Universal Binary)
        run: |
          cmake -B build -S . \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel --target PowerDrumMapper_VST3 PowerDrumMapper_Standalone PowerDrumMapper_CLAP

      # Unit tests run in the Windows job only (the logic under test is
      # platform-independent; keeps the macOS job free of GUI-init quirks).

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-macOS-CLAP
          path: |
            build/PowerDrumMapper_artefacts/Release/CLAP/

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-macOS-VST3
          path: |
            build/PowerDrumMapper_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: PowerDrumMapper-macOS-Standalone
          path: |
            build/PowerDrumMapper_artefacts/Release/Standalone/

  # ============================================================
  # Release：推送 v* 标签时，把两个平台的产物打包发布到 GitHub Release
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Pack per-platform zips
        run: |
          set -euo pipefail
          mkdir -p stage/Windows/CLAP stage/Windows/VST3 stage/Windows/Standalone
          mkdir -p stage/macOS/CLAP   stage/macOS/VST3   stage/macOS/Standalone
          cp -r dist/PowerDrumMapper-Windows-CLAP/.       stage/Windows/CLAP/
          cp -r dist/PowerDrumMapper-Windows-VST3/.        stage/Windows/VST3/
          cp -r dist/PowerDrumMapper-Windows-Standalone/.  stage/Windows/Standalone/
          cp -r dist/PowerDrumMapper-macOS-CLAP/.          stage/macOS/CLAP/
          cp -r dist/PowerDrumMapper-macOS-VST3/.          stage/macOS/VST3/
          cp -r dist/PowerDrumMapper-macOS-Standalone/.    stage/macOS/Standalone/
          # MSVC import-library leftovers are useless to plugin users.
          find stage \( -name '*.exp' -o -name '*.lib' \) -delete
          (cd stage && zip -qr ../PowerDrumMapper-Windows.zip Windows && zip -qr ../PowerDrumMapper-macOS.zip macOS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            PowerDrumMapper-Windows.zip
            PowerDrumMapper-macOS.zip
